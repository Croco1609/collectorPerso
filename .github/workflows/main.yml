name: CI Collector Shop

on: [push, pull_request]

jobs:
  # ==========================================
  # JOB 1 : TESTS ET SÉCURITÉ
  # ==========================================
  test-and-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Installation Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installation dépendances
        run: npm install

      - name: Audit de sécurité (DevSecOps)
        run: npm audit --audit-level=critical

      - name: Exécution des tests (avec couverture)
        run: npm test -- --coverage
        env:
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: testdb
          DB_FORCE_RESTART: 'true'

      - name: Sauvegarde du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ==========================================
  # JOB 2 : ANALYSE QUALITÉ SONARCLOUD
  # ==========================================
  sonar-analysis:
    needs: test-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # On récupère le carton laissé par le Job 1 📥
      - name: Récupération du rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Analyse SonarCloud 🕵️‍♂️
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
name: CI Collector Shop

on: [push, pull_request]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Installation Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installation dépendances
        run: npm install

      - name: Audit de sécurité (DevSecOps)
        run: npm audit --audit-level=critical

      - name: Exécution des tests
        run: npm test
        env:
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: testdb